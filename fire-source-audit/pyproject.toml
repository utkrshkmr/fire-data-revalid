[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-source-audit"
version = "0.1.0"
description = "Cross-check wildfire ignition points, perimeters, timing, size and cause across U.S. federal and California agency data sources"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.5",
  "pyogrio>=0.7",
  "rasterio>=1.3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "h5py>=3.8",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
goes = ["s3fs>=2023.6", "xarray>=2023.6", "h5netcdf>=1.2"]
dev = ["pytest>=7"]

[project.scripts]
fsa = "fsa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
